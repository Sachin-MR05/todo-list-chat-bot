<div class="chatbot-container">
    <!-- The button to toggle the chat window -->
    <button class="chatbot-toggle-button" id="chatbot-toggle-button" aria-label="Toggle Chat">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 15c4.418 0 8-3.134 8-7s-3.582-7-8-7-8 3.134-8 7c0 1.76.743 3.37 1.97 4.6-.097 1.016-.417 2.13-.771 2.966-.079.186.074.394.273.362 2.256-.37 3.597-.938 4.18-1.234A9.06 9.06 0 0 0 8 15z"/>
        </svg>
    </button>

    <!-- The chat window itself -->
    <div class="chat-window hidden" id="chat-window">
        <div class="chat-header">
            <h3>LifeTrack AI Assistant</h3>
            <button class="chat-close-button" id="chat-close-button" aria-label="Close Chat">&times;</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-message bot">
                Hello! How can I help you with your tasks today?
            </div>
        </div>
        <form class="chat-input-form" id="chat-input-form">
            <input type="text" class="chat-input" id="chat-input" placeholder="Ask a question..." autocomplete="off">
            <button type="submit" class="chat-send-button" id="chat-send-button" aria-label="Send Message">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
                </svg>
            </button>
        </form>
    </div>
</div>
